<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试诊断页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-card {
            background: white;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #ccc;
        }
        .running { border-left-color: #ffc107; }
        .pass { border-left-color: #4CAF50; }
        .fail { border-left-color: #f44336; }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background: #5568d3; }
    </style>
</head>
<body>
    <h1>🔊 TTS 诊断工具（简化版）</h1>
    <button onclick="runTests()">▶️ 开始诊断</button>
    <div id="results"></div>

    <script>
        function runTests() {
            const results = document.getElementById('results');
            results.innerHTML = '';

            // 测试1: 浏览器支持
            addTest('浏览器支持', 'running');
            setTimeout(() => {
                updateTest(0, 'pass', '✅ 支持 speechSynthesis');

                // 测试2: 语音加载
                addTest('语音加载', 'running');
                setTimeout(() => {
                    const voices = speechSynthesis.getVoices();
                    updateTest(1, voices.length > 0 ? 'pass' : 'fail',
                        `✅ 加载了 ${voices.length} 个语音`);

                    // 测试3: 播放测试
                    addTest('播放测试', 'running');
                    const utterance = new SpeechSynthesisUtterance('Test');
                    utterance.onstart = () => {
                        updateTest(2, 'pass', '✅ 播放成功');
                        speechSynthesis.cancel();
                    };
                    utterance.onerror = (e) => {
                        updateTest(2, 'fail', `❌ 播放失败: ${e.error}`);
                    };
                    speechSynthesis.speak(utterance);
                }, 1000);
            }, 500);
        }

        function addTest(title, status) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-card ${status}`;
            div.id = `test-${results.children.length}`;
            div.innerHTML = `<strong>${title}</strong> - 测试中...`;
            results.appendChild(div);
        }

        function updateTest(index, status, message) {
            const test = document.getElementById(`test-${index}`);
            if (test) {
                test.className = `test-card ${status}`;
                test.innerHTML = `<strong>${message}</strong>`;
            }
        }
    </script>
</body>
</html>
