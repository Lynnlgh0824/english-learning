<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 我的英语学习记录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #008080 0%, #006666 100%);
            min-height: 100vh;
            padding: 5px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 15px;
        }

        .header {
            background: white;
            padding: 12px 18px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            margin-bottom: 8px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            color: #008080;
            font-size: 2em;
            margin-bottom: 4px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .add-button {
            display: inline-block;
            background: linear-gradient(135deg, #008080 0%, #006666 100%);
            color: white;
            padding: 8px 18px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1em;
            margin-top: 6px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 3px 12px rgba(102, 126, 234, 0.3);
        }

        .add-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .config-button {
            display: inline-block;
            background: linear-gradient(135deg, #ffa726 0%, #ff9800 100%);
            color: white;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.4);
        }

        .config-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 152, 0, 0.6);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 6px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #006666;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .filter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .search-box-inline {
            flex: 1;
            min-width: 200px;
            background: white;
            padding: 8px 10px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .search-box {
            background: white;
            padding: 8px 10px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 8px;
        }

        .search-box input,
        .search-box-inline input {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .search-box input:focus,
        .search-box-inline input:focus {
            outline: none;
            border-color: #008080;
        }

        .records-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }

        .date-group {
            margin-bottom: 12px;
        }

        .date-header {
            background: white;
            padding: 8px 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .date-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #008080;
        }

        .date-weekday {
            color: #999;
            font-size: 0.95em;
        }

        .date-stats {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            color: #666;
        }

        .date-stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .view-toggle {
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            text-align: center;
        }

        .view-toggle button {
            padding: 8px 18px;
            border: 2px solid #008080;
            background: white;
            color: #008080;
            border-radius: 20px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0 5px;
        }

        .view-toggle button.active {
            background: #008080;
            color: white;
        }

        .view-toggle button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .date-nav {
            background: white;
            padding: 6px 10px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            gap: 6px;
            overflow-x: auto;
            align-items: center;
            flex-shrink: 0;
        }

        .date-nav-btn {
            padding: 6px 12px;
            border: 2px solid #e0e0e0;
            background: white;
            color: #666;
            border-radius: 20px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .date-nav-btn:hover {
            border-color: #008080;
            color: #008080;
            transform: translateY(-2px);
        }

        .date-nav-btn.active {
            background: linear-gradient(135deg, #008080 0%, #006666 100%);
            color: white;
            border-color: #008080;
        }

        .date-nav-btn.today {
            border-color: #4caf50;
            color: #4caf50;
        }

        .date-nav-btn.today.active {
            background: #4caf50;
            color: white;
        }

        .date-nav-icon {
            font-size: 1.2em;
        }

        .record-list {
            background: white;
            border-radius: 12px;
            padding: 0;
            margin-top: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .record-list-item {
            padding: 10px 15px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .record-list-item:last-child {
            border-bottom: none;
        }

        .record-list-item:hover {
            background: #f8f9ff;
            padding-left: 25px;
        }

        .record-list-type {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
            white-space: nowrap;
        }

        .record-list-type.youtube {
            background: #ffebee;
            color: #f44336;
        }

        .record-list-type.ted {
            background: #fff3e0;
            color: #ff9800;
        }

        .record-list-type.article {
            background: #e8f5e9;
            color: #4caf50;
        }

        .record-list-title {
            flex: 1;
            color: #333;
            font-size: 0.95em;
            font-weight: 500;
        }

        .record-list-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            color: #999;
        }

        .record-list-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .refresh-section {
            text-align: center;
            margin-bottom: 6px;
        }

        .refresh-btn-top {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #4caf50 0%, #66bb6a 100%);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
            z-index: 10;
        }

        .refresh-btn-top:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.5);
        }

        .refresh-btn-top .refresh-icon {
            font-size: 1.2em;
        }

        .refresh-btn {
            background: white;
            padding: 6px 16px;
            border: 2px solid #4caf50;
            border-radius: 20px;
            color: #4caf50;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.15);
        }

        .refresh-btn:hover {
            background: #4caf50;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .refresh-icon {
            font-size: 1.1em;
        }

        .cache-info {
            background: #fff3e0;
            border: 1px solid #ffb74d;
            padding: 6px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.9em;
            color: #e65100;
            display: none;
            text-align: center;
        }

        .cache-info.show {
            display: block;
        }

        .loading-indicator {
            text-align: center;
            padding: 10px;
            color: #008080;
            font-size: 1.1em;
            display: none;
        }

        .loading-indicator.show {
            display: block;
        }

        .record-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .record-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .record-title {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .record-date {
            color: #999;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .record-type {
            display: inline-block;
            padding: 4px 12px;
            background: #008080;
            color: white;
            border-radius: 20px;
            font-size: 0.8em;
            margin-bottom: 10px;
        }

        .record-type.youtube {
            background: #ff0000;
        }

        .record-type.ted {
            background: #e00;
        }

        .record-type.article {
            background: #4caf50;
        }

        .record-preview {
            color: #666;
            font-size: 0.9em;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .record-stats {
            display: flex;
            gap: 12px;
            font-size: 0.8em;
            color: #999;
        }

        .record-stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .empty-state {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            background: white;
            max-width: 900px;
            margin: 15px auto;
            padding: 20px 25px;
            border-radius: 12px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 1.6em;
            color: #999;
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #333;
        }

        .config-modal-content {
            max-width: 700px;
        }

        .config-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e8eaed;
        }

        .config-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .config-section h3 {
            color: #008080;
            font-size: 1.1em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .config-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .config-item:last-child {
            margin-bottom: 0;
        }

        .config-label {
            flex: 1;
            font-size: 0.95em;
            color: #2c3e50;
        }

        .config-input {
            width: 150px;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.9em;
            transition: border-color 0.3s;
        }

        .config-input:focus {
            outline: none;
            border-color: #008080;
        }

        .config-select {
            width: 180px;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.9em;
            background: white;
            cursor: pointer;
        }

        .config-select:focus {
            outline: none;
            border-color: #008080;
        }

        .config-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .config-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #e8eaed;
        }

        .config-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .config-btn-primary {
            background: linear-gradient(135deg, #008080 0%, #006666 100%);
            color: white;
        }

        .config-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 128, 128, 0.4);
        }

        .config-btn-secondary {
            background: #f5f5f5;
            color: #666;
        }

        .config-btn-secondary:hover {
            background: #e8e8e8;
        }

        .preset-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .preset-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.3s;
        }

        .preset-btn:hover {
            border-color: #008080;
            color: #008080;
        }

        .preset-btn.active {
            background: #008080;
            color: white;
            border-color: #008080;
        }

        .modal-body {
            line-height: 1.7;
            color: #333;
            font-size: 1.05em;
        }

        .modal-body h1,
        .modal-body h2,
        .modal-body h3 {
            color: #008080;
            margin-top: 12px;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .modal-body h1 { font-size: 1.8em; }
        .modal-body h2 { font-size: 1.4em; }
        .modal-body h3 { font-size: 1.2em; }

        .modal-body ul,
        .modal-body ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }

        .modal-body li {
            margin-bottom: 4px;
        }

        .modal-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.95em;
        }

        .modal-body th,
        .modal-body td {
            padding: 8px 10px;
            border: 1px solid #e0e0e0;
            text-align: left;
        }

        .modal-body th {
            background: #f5f5f5;
            color: #008080;
        }

        .modal-body code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.6em;
            }

            .records-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                margin: 10px;
                padding: 15px;
            }

            .modal-body {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="refresh-btn-top" onclick="forceRefresh()" title="清除所有缓存（包括TTS语音设置）并刷新">
                <span class="refresh-icon">🔄</span>
            </button>
            <h1>📚 我的英语学习记录</h1>
            <p>记录每一次学习的足迹 💪</p>
            <div class="header-actions">
                <a href="#" onclick="showConfigModal(); return false;" class="config-button" title="配置学习参数">
                    ⚙️ 学习配置
                </a>
                <a href="#" onclick="showAddModal(); return false;" class="add-button">
                    ➕ 添加新学习
                </a>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalRecords">0</div>
                    <div class="stat-label">学习记录</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalWords">0</div>
                    <div class="stat-label">词汇学习</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalHours">0</div>
                    <div class="stat-label">学习小时</div>
                </div>
            </div>
        </div>
        <div class="cache-info" id="cacheInfo"></div>

        <div class="filter-row">
            <div class="search-box-inline">
                <input type="text" id="searchInput" placeholder="🔍 搜索学习记录...">
            </div>
            <div class="date-nav" id="dateNav">
                <!-- 日期导航按钮会在这里动态生成 -->
            </div>
        </div>

        <div class="loading-indicator" id="loadingIndicator">
            🔄 正在加载学习记录...
        </div>

        <div id="recordsContainer">
            <div class="records-grid" id="recordsGrid">
            <!-- 学习记录卡片将在这里动态生成 -->
            </div>
            <div id="dateGroupsContainer">
                <!-- 日期分组内容将在这里动态生成 -->
            </div>
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
            <h2>还没有学习记录</h2>
            <p>使用 /learn-english 开始你的学习之旅！</p>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('modal')">&times;</span>
            <div class="modal-body" id="modalBody">
                <!-- 学习内容将在这里显示 -->
            </div>
        </div>
    </div>

    <!-- 添加新学习模态框 -->
    <div class="modal" id="addModal">
        <div class="modal-content" style="max-width: 550px; padding: 25px;">
            <span class="modal-close" onclick="closeModal('addModal')">&times;</span>
            <div class="modal-body">
                <h2 style="text-align: center; margin-top: 0;">➕ 添加新的英语学习</h2>
                <div style="margin-top: 20px; line-height: 1.8;">
                    <p><strong>📝 输入要学习的链接：</strong></p>

                    <div style="margin: 15px 0;">
                        <input
                            type="url"
                            id="learningUrl"
                            placeholder="https://www.ted.com/talks/... 或 https://www.youtube.com/watch?v=..."
                            style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1em; transition: border-color 0.3s;"
                            onfocus="this.style.borderColor='#008080'"
                            onblur="this.style.borderColor='#e0e0e0'"
                        >
                    </div>

                    <button
                        onclick="copyLearnCommand()"
                        style="width: 100%; padding: 12px; background: linear-gradient(135deg, #008080 0%, #006666 100%); color: white; border: none; border-radius: 8px; font-size: 1em; font-weight: bold; cursor: pointer; transition: transform 0.3s; margin-bottom: 15px;"
                        onmouseover="this.style.transform='translateY(-2px)'"
                        onmouseout="this.style.transform='translateY(0)'"
                    >
                        📋 复制命令并在 Claude Code 中执行
                    </button>

                    <div id="copyStatus" style="display: none; margin: 10px 0; padding: 12px; border-radius: 8px; font-size: 0.95em;"></div>

                    <div style="background: #f5f5f5; padding: 12px; border-radius: 8px; margin-top: 15px;">
                        <p style="margin: 0 0 8px 0; font-size: 0.9em; color: #666;">📋 将复制的命令粘贴到 Claude Code 终端中执行：</p>
                        <pre id="commandPreview" style="background: white; padding: 10px; border-radius: 6px; margin: 0; overflow-x: auto; font-size: 0.9em; color: #008080;">/learn-english [输入URL后自动生成]</pre>
                    </div>

                    <p style="margin-top: 15px; padding: 12px; background: #e3f2fd; border-radius: 8px; font-size: 0.95em;">
                        ✅ 学习记录会自动保存<br>
                        📁 保存位置：~/english-learning/records/<br>
                        🔄 刷新此页面即可看到新记录
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 学习记录数据
        let records = [];
        let byDateData = {};
        let initialRecordCount = 0;

        // 加载学习记录
        async function loadRecords() {
            const loadingIndicator = document.getElementById('loadingIndicator');

            try {
                loadingIndicator.classList.add('show');
                const timestamp = new Date().getTime();
                const response = await fetch(`data.json?v=${timestamp}`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                records = data.records || [];
                byDateData = data.byDate || {};

                if (initialRecordCount === 0) {
                    initialRecordCount = records.length;
                }

                renderByDate();
                updateStats();
            } catch (error) {
                console.error('❌ 加载失败:', error);
                records = [];
                byDateData = {};
                renderByDate();
                updateStats();

                const cacheInfo = document.getElementById('cacheInfo');
                cacheInfo.innerHTML = `⚠️ 数据加载失败: ${error.message}<br>请确保在 http://localhost:8000 访问`;
                cacheInfo.classList.add('show');
            } finally {
                loadingIndicator.classList.remove('show');
            }
        }

        // 按日期渲染
        function renderByDate() {
            const container = document.getElementById('recordsContainer');
            const grid = document.getElementById('recordsGrid');
            const dateGroupsContainer = document.getElementById('dateGroupsContainer');
            const emptyState = document.getElementById('emptyState');

            if (Object.keys(byDateData).length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            container.style.display = 'block';
            emptyState.style.display = 'none';
            grid.style.display = 'none';
            dateGroupsContainer.style.display = 'block';

            const sortedDates = Object.keys(byDateData).sort().reverse().slice(0, 10);

            dateGroupsContainer.innerHTML = sortedDates.map(date => {
                const dateInfo = byDateData[date];
                const dateRecords = dateInfo.records.map(id =>
                    records.find(r => r.id === id)
                ).filter(Boolean);

                return `
                    <div class="date-group">
                        <div class="date-header">
                            <div class="date-header-left">
                                <div class="date-title">${formatDate(date)}</div>
                                <div class="date-weekday">${dateInfo.weekday}</div>
                            </div>
                            <div class="date-stats">
                                <div class="date-stat">
                                    <span>📚</span>
                                    <span>${dateInfo.count} 篇</span>
                                </div>
                                <div class="date-stat">
                                    <span>📖</span>
                                    <span>${dateInfo.totalWords} 词</span>
                                </div>
                                <div class="date-stat">
                                    <span>💬</span>
                                    <span>${dateInfo.totalExpressions} 表达</span>
                                </div>
                            </div>
                        </div>
                        <div class="record-list">
                            ${dateRecords.map(record => `
                                <div class="record-list-item" onclick="openRecord('${record.file}')">
                                    <span class="record-list-type ${record.type}">${record.typeLabel}</span>
                                    <span class="record-list-title">${record.title}</span>
                                    <div class="record-list-meta">
                                        <span>📖 ${record.wordCount || 20}</span>
                                        <span>💬 ${record.expressionCount || 15}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            renderDateNav();
        }

        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            if (dateStr === formatDateStr(today)) {
                return '今天';
            } else if (dateStr === formatDateStr(yesterday)) {
                return '昨天';
            } else {
                return dateStr;
            }
        }

        function formatDateStr(date) {
            return date.toISOString().split('T')[0];
        }

        // 生成日期导航
        function renderDateNav() {
            const dateNav = document.getElementById('dateNav');
            const today = formatDateStr(new Date());
            const sortedDates = Object.keys(byDateData).sort().reverse().slice(0, 10);

            if (sortedDates.length === 0) {
                dateNav.style.display = 'none';
                return;
            }

            dateNav.style.display = 'flex';

            const navHTML = sortedDates.map(date => {
                const dateInfo = byDateData[date];
                const isToday = date === today;
                const isYesterday = date === formatDateStr(new Date(Date.now() - 86400000));

                let btnClass = 'date-nav-btn';
                let icon = '<span class="date-nav-icon">📆</span>';
                let text = date;

                if (isToday) {
                    btnClass += ' today active';
                    icon = '<span class="date-nav-icon">☀️</span>';
                    text = '今天';
                } else if (isYesterday) {
                    icon = '<span class="date-nav-icon">📅</span>';
                    text = '昨天';
                }

                return `<button class="${btnClass}" onclick="scrollToDate('${date}')">
                    ${icon}
                    <span>${text}</span>
                </button>`;
            }).join('');

            dateNav.innerHTML = navHTML;
        }

        function scrollToDate(dateStr) {
            setTimeout(() => {
                const dateGroups = document.querySelectorAll('.date-group');
                dateGroups.forEach(group => {
                    const header = group.querySelector('.date-title');
                    if (header && header.textContent.includes(formatDate(dateStr))) {
                        group.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
            }, 100);

            document.querySelectorAll('.date-nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // 更新统计数据
        function updateStats() {
            document.getElementById('totalRecords').textContent = records.length;
            document.getElementById('totalWords').textContent = records.length * 20;
            document.getElementById('totalHours').textContent = records.length * 1.5;
        }

        // 打开学习记录详情
        function openRecord(filename) {
            window.location.href = `records/${filename}`;
        }

        // 关闭模态框
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // 显示添加学习模态框
        function showAddModal() {
            document.getElementById('addModal').classList.add('active');
        }

        // 显示配置弹窗
        function showConfigModal() {
            document.getElementById('configModal').classList.add('active');
        }

        // 刷新页面
        function forceRefresh() {
            localStorage.clear();
            location.reload();
        }

        // 复制学习命令
        function copyLearnCommand() {
            const urlInput = document.getElementById('learningUrl');
            const url = urlInput.value.trim();

            if (!url) {
                const copyStatus = document.getElementById('copyStatus');
                copyStatus.style.display = 'block';
                copyStatus.style.background = '#fff3e0';
                copyStatus.style.color = '#e65100';
                copyStatus.textContent = '⚠️ 请先输入学习链接';
                return;
            }

            const command = `/learn-english ${url}`;
            
            navigator.clipboard.writeText(command).then(() => {
                const copyStatus = document.getElementById('copyStatus');
                copyStatus.style.display = 'block';
                copyStatus.style.background = '#e8f5e9';
                copyStatus.style.color = '#2e7d32';
                copyStatus.innerHTML = `✅ 命令已复制！<br>💡 现在粘贴到 Claude Code 终端执行<br><pre style="background: white; padding: 8px; border-radius: 4px; margin-top: 8px;">${command}</pre>`;
            }).catch(err => {
                alert('复制失败，请手动复制命令');
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadRecords();

            // 搜索功能
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                if (query.length > 0) {
                    const filtered = records.filter(r => 
                        r.title.toLowerCase().includes(query) ||
                        r.preview.toLowerCase().includes(query)
                    );
                    renderRecords(filtered);
                } else {
                    renderByDate();
                }
            });

            // URL 输入框自动生成命令
            const urlInput = document.getElementById('learningUrl');
            const commandPreview = document.getElementById('commandPreview');
            urlInput.addEventListener('input', (e) => {
                const url = e.target.value.trim();
                if (url) {
                    commandPreview.textContent = `/learn-english ${url}`;
                } else {
                    commandPreview.textContent = '/learn-english [输入URL后自动生成]';
                }
            });
        });

        // 模态框点击外部关闭
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
